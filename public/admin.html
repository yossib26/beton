<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BetOn · קונסולת ניהול</title>
<style>
  :root {
    --bg: #0f172a; --surface: #1e293b; --surface-2: #334155; --line: #475569;
    --text: #f1f5f9; --muted: #94a3b8; --accent: #38bdf8; --accent-ink: #04222e;
    --good: #4ade80; --bad: #f87171; --gold: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    background: #020617; color: var(--text); min-height: 100vh;
  }
  header {
    background: var(--surface); border-bottom: 1px solid var(--line);
    padding: 14px 20px; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 10;
  }
  header .brand { font-weight: 800; letter-spacing: .5px; }
  header .who { font-size: .8rem; color: var(--muted); }
  .wrap { max-width: 960px; margin: 0 auto; padding: 20px; }

  .tabnav { display: flex; gap: 6px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
  .tabnav button {
    background: none; border: 0; border-bottom: 2px solid transparent;
    color: var(--muted); font: inherit; font-weight: 600; padding: 10px 14px; cursor: pointer;
  }
  .tabnav button.active { color: var(--accent); border-bottom-color: var(--accent); }

  h2 { font-size: 1.1rem; margin: 0 0 14px; }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px; margin-bottom: 14px;
  }
  .muted { color: var(--muted); font-size: .85rem; }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; }
  .wrap-row { flex-wrap: wrap; }

  input, select {
    padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 10px; color: var(--text); font: inherit; width: 100%;
  }
  input::placeholder { color: var(--muted); }
  label { display: block; font-size: .8rem; color: var(--muted); margin: 10px 0 4px; }

  button.btn {
    padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--text); font: inherit; font-weight: 600; cursor: pointer;
    white-space: nowrap;
  }
  button.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.btn.ghost { background: none; }
  button.btn.danger { color: var(--bad); border-color: var(--bad); background: none; }
  button.btn.sm { padding: 6px 10px; font-size: .82rem; }
  button.btn:disabled { opacity: .5; }
  a.btn { text-decoration: none; display: inline-block; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: start; padding: 10px 8px; border-bottom: 1px solid var(--line); font-size: .9rem; }
  th { color: var(--muted); font-weight: 600; }
  td .row { gap: 6px; }
  .tbl-scroll { overflow-x: auto; }

  .pill { display: inline-block; font-size: .72rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .pill.open { color: var(--good); border-color: var(--good); }
  .pill.closed { color: var(--gold); border-color: var(--gold); }
  .pill.resolved { color: var(--accent); border-color: var(--accent); }
  .pill.admin { color: var(--gold); border-color: var(--gold); }

  .datebar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .adm-answer { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .adm-answer input.txt { flex: 1; }
  .adm-answer input.num { width: 90px; text-align: center; }
  hr.sep { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
  .center { text-align: center; padding: 40px 10px; color: var(--muted); }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
    padding: 10px 16px; border-radius: 999px; font-size: .85rem; z-index: 50;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .toast.err { border-color: var(--bad); color: #fecaca; }

  .gate { max-width: 360px; margin: 60px auto; }

  /* stats: bettor icon crowd */
  .stat-faces {
    display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: flex-end;
    justify-content: center; padding: 12px 4px;
  }
  .stat-face { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 76px; }
  .stat-face .badge {
    width: var(--sz, 48px); height: var(--sz, 48px); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface-2); border: 2px solid var(--line);
    font-size: calc(var(--sz, 48px) * .5); position: relative;
  }
  .stat-face.leader .badge { border-color: var(--gold); }
  .stat-face .crown { position: absolute; top: -14px; font-size: 15px; }
  .stat-face .nm { font-size: .72rem; text-align: center; line-height: 1.15; }
  .stat-face .sc { font-size: .72rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat-face .sc.zero { color: var(--muted); font-weight: 600; }
</style></style>
</head>
<body>
<header id="hdr" hidden>
  <div>
    <div class="brand">BetOn · ניהול ⚙️</div>
    <div class="who" id="who"></div>
  </div>
  <div class="row">
    <a class="btn ghost sm" href="/">→ לאפליקציה</a>
    <button class="btn ghost sm" id="logoutBtn" type="button">↩ התנתקות</button>
  </div>
</header>

<div class="wrap" id="main"></div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  for (const k of kids.flat()) n.append(k?.nodeType ? k : document.createTextNode(k ?? ''));
  return n;
};
const api = async (path, opts = {}) => {
  const res = await fetch(path, {
    headers: opts.body ? { 'Content-Type': 'application/json' } : {},
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = res.status === 204 ? null : await res.json().catch(() => null);
  if (!res.ok) throw new Error(data?.error || `שגיאה ${res.status}`);
  return data;
};
let toastT;
const toast = (msg, isErr = false) => {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toastT);
  toastT = setTimeout(() => (t.className = 'toast'), 2400);
};
const fmt = (n) => (n > 0 ? '+' : '') + (Math.round(n * 100) / 100);
const todayISO = () => new Date().toLocaleDateString('sv-SE');
const heDate = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('he-IL', { weekday: 'short', day: 'numeric', month: 'numeric', year: '2-digit' });

const state = { user: null, tab: 'events', date: todayISO() };

// palette users can be given in the admin console (kept in sync with the login page)
const USER_ICONS = ['😀','😎','🤩','🥳','🤠','🤖','👻','👽','🐸','🐵','🦊','🐼','🦁','🐯','🐨','🦄','🐙','🦖','🦈','🐧','🦉','🐝','⭐','🔥','⚽','🏀','🎯','🎲','💪','🧠','🃏','🚀','🍀','🌈','🍕','🎸'];

// ---------------- login gate ----------------
const ADMIN_DEFAULT = { username: 'yossi', password: 'beton123' };

function renderGate(msg) {
  $('#hdr').hidden = true;
  $('#logoutBtn').hidden = true;
  const m = $('#main');
  m.innerHTML = '';
  const userI = el('input', { placeholder: 'שם משתמש', autocapitalize: 'off', value: ADMIN_DEFAULT.username });
  const passI = el('input', { placeholder: 'סיסמה', type: 'password', value: ADMIN_DEFAULT.password });
  const btn = el('button', { className: 'btn primary grow', type: 'button' }, 'כניסת מנהל');
  btn.onclick = async () => {
    try {
      const u = await api('/api/auth/login', { method: 'POST', body: { username: userI.value.trim(), password: passI.value } });
      if (!u.is_admin) { await api('/api/auth/logout', { method: 'POST' }).catch(() => {}); return toast('למשתמש הזה אין הרשאת ניהול', true); }
      state.user = u;
      boot();
    } catch (e) { toast(e.message, true); }
  };
  m.append(el('div', { className: 'gate' },
    el('h2', { style: 'text-align:center' }, 'קונסולת ניהול'),
    msg ? el('p', { className: 'muted', style: 'text-align:center' }, msg) : '',
    el('div', { className: 'card' },
      el('label', {}, 'שם משתמש'), userI,
      el('label', {}, 'סיסמה'), passI,
      el('div', { className: 'row', style: 'margin-top:16px' }, btn),
      el('p', { className: 'muted', style: 'margin-bottom:0' }, 'משתמש ברירת מחדל: yossi / beton123 (מולא מראש)'),
    ),
  ));
}

// ---------------- shell ----------------
function boot() {
  $('#hdr').hidden = false;
  $('#logoutBtn').hidden = false;
  $('#who').textContent = state.user.name + ' · מנהל';
  render();
}
$('#logoutBtn').onclick = async () => {
  await api('/api/auth/logout', { method: 'POST' }).catch(() => {});
  state.user = null;
  renderGate();
};

function render() {
  const m = $('#main');
  m.innerHTML = '';
  const nav = el('div', { className: 'tabnav' });
  const tabs = [
    ['events', 'אירועים'], ['stats', '📊 סטטיסטיקה'], ['bets', '🎟 הימורים'],
    ['users', 'משתמשים'], ['messages', '💬 הודעות'], ['tips', '💡 טיפים'],
  ];
  for (const [id, label] of tabs) {
    nav.append(el('button', {
      className: state.tab === id ? 'active' : '',
      type: 'button',
      onclick: () => { state.tab = id; render(); },
    }, label));
  }
  m.append(nav);
  const body = el('div', { id: 'tabbody' });
  m.append(body);
  if (state.tab === 'events') renderEvents(body);
  else if (state.tab === 'stats') renderStats(body);
  else if (state.tab === 'bets') renderBets(body);
  else if (state.tab === 'messages') renderTextPool(body, {
    endpoint: 'bet-messages', title: '💬 הודעות אחרי הימור',
    hint: 'בכל הימור מוקפצת למהמר הודעה אקראית. שם המהמר מתווסף בהתחלה; אפשר גם לשלב {name} בתוך הטקסט.',
    placeholder: 'הודעה מצחיקה חדשה… (אפשר {name})',
  });
  else if (state.tab === 'tips') renderTextPool(body, {
    endpoint: 'daily-tips', title: '💡 טיפ יומי',
    hint: 'במסך ההימורים מוצג טיפ אקראי אחד מהרשימה בכל טעינה.',
    placeholder: 'טיפ חדש מעולם ההימורים…',
  });
  else renderUsers(body);
}

// ---------------- editable text pool (messages / tips) ----------------
async function renderTextPool(root, { endpoint, title, hint, placeholder }) {
  const reload = () => renderTextPool(root, { endpoint, title, hint, placeholder });
  root.innerHTML = '';
  root.append(el('h2', {}, title), el('div', { className: 'center' }, 'טוען…'));

  let items;
  try { items = await api('/api/admin/' + endpoint); }
  catch (e) { toast(e.message, true); return; }

  root.innerHTML = '';
  root.append(el('h2', {}, title), el('p', { className: 'muted', style: 'margin-top:0' }, hint));

  const input = el('input', { placeholder });
  const addBtn = el('button', { className: 'btn primary', type: 'button' }, 'הוסף');
  addBtn.onclick = async () => {
    if (!input.value.trim()) return;
    try { await api('/api/admin/' + endpoint, { method: 'POST', body: { text: input.value.trim() } }); input.value = ''; reload(); }
    catch (e) { toast(e.message, true); }
  };
  root.append(el('div', { className: 'card' },
    el('div', { className: 'row wrap-row' }, el('div', { className: 'grow' }, input), addBtn)));

  const list = el('div', { className: 'card' });
  if (!items.length) list.append(el('div', { className: 'muted' }, 'אין פריטים'));
  items.forEach((it, i) => {
    const txt = el('input', { value: it.text });
    const save = el('button', {
      className: 'btn ghost sm', type: 'button',
      onclick: async () => {
        if (!txt.value.trim() || txt.value.trim() === it.text) return;
        try { await api('/api/admin/' + endpoint + '/' + it.id, { method: 'PATCH', body: { text: txt.value.trim() } }); it.text = txt.value.trim(); toast('נשמר'); }
        catch (e) { toast(e.message, true); }
      },
    }, '💾');
    const del = el('button', {
      className: 'btn danger sm', type: 'button',
      onclick: async () => {
        if (!confirm('למחוק?')) return;
        try { await api('/api/admin/' + endpoint + '/' + it.id, { method: 'DELETE' }); reload(); }
        catch (e) { toast(e.message, true); }
      },
    }, '🗑');
    list.append(el('div', { className: 'row wrap-row', style: i ? 'padding-top:8px;border-top:1px solid var(--line);margin-top:8px' : '' },
      el('div', { className: 'muted', style: 'width:20px' }, String(i + 1)),
      el('div', { className: 'grow' }, txt),
      save, del,
    ));
  });
  root.append(list);
}

// ---------------- events tab ----------------
function dateBar(onChange) {
  const shift = (days) => {
    const d = new Date(state.date + 'T00:00:00');
    d.setDate(d.getDate() + days);
    state.date = d.toLocaleDateString('sv-SE');
    onChange();
  };
  const picker = el('input', { type: 'date', value: state.date, style: 'width:auto' });
  picker.onchange = () => { state.date = picker.value; onChange(); };
  const isToday = state.date === todayISO();
  return el('div', { className: 'datebar' },
    el('button', { className: 'btn sm', type: 'button', onclick: () => shift(-1) }, '‹ יום קודם'),
    el('button', {
      className: 'btn sm' + (isToday ? ' primary' : ''), type: 'button',
      disabled: isToday, onclick: () => { state.date = todayISO(); onChange(); },
    }, 'היום'),
    picker,
    el('button', { className: 'btn sm', type: 'button', onclick: () => shift(1) }, 'מחר ›'),
  );
}

async function renderEvents(root) {
  root.innerHTML = '';
  root.append(el('h2', {}, 'ניהול אירועים'), dateBar(() => renderEvents(root)), el('div', { className: 'center' }, 'טוען…'));

  let questions, stats;
  try {
    [questions, stats] = await Promise.all([
      api('/api/admin/questions?date=' + state.date),
      api('/api/admin/stats').catch(() => ({ rows: [], range: null })),
    ]);
  } catch (e) { toast(e.message, true); return; }
  let standings = stats.rows;
  const statsRange = stats.range;

  // per-event bettor list (pick + how many of the 3 changes each has used)
  await Promise.all(questions.map(async (qq) => {
    qq._bettors = await api('/api/admin/questions/' + qq.id + '/bets').catch(() => []);
  }));

  root.innerHTML = '';
  root.append(el('h2', {}, 'אירועי ' + heDate(state.date)), dateBar(() => renderEvents(root)));

  const isPast = state.date < todayISO();
  if (isPast) {
    root.append(el('div', { className: 'card muted' },
      '📅 יום שעבר — אפשר להכריע ולערוך אירועים קיימים, אך לא להוסיף אירוע חדש. ' +
      'הוספת אירוע אפשרית להיום או לימים קדימה בלבד.'));
  }
  if (questions.length > 1) {
    root.append(el('div', { className: 'card', style: 'color:var(--bad)' },
      `⚠ ${questions.length} אירועים ביום הזה — למהמרים מוצג רק הראשון. הרץ \`npm run db:spread-events\` או שנה תאריכים.`));
  }

  // live standings for the current betting window (previous week's Friday
  // through today) — recomputed from every resolved event, refreshed in place
  const standBody = el('div', {});
  const paintStandings = () => {
    standBody.innerHTML = '';
    if (!standings.length) { standBody.append(el('div', { className: 'muted' }, 'אין נתונים עדיין')); return; }
    standings.forEach((r, i) => {
      standBody.append(el('div', { className: 'row', style: 'padding:5px 0;border-top:1px solid var(--line)' },
        el('div', { className: 'muted', style: 'width:20px' }, String(i + 1)),
        el('div', { className: 'grow' }, r.name),
        el('div', { className: 'muted', style: 'font-size:.8rem' }, `${r.hits} פגיעות`),
        el('div', { style: 'font-weight:800;font-variant-numeric:tabular-nums;width:52px;text-align:left' }, fmt(r.score)),
      ));
    });
  };
  paintStandings();
  const refreshStandings = async () => {
    try { standings = (await api('/api/admin/stats')).rows; paintStandings(); } catch { /* keep last */ }
  };
  const dm = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric' });
  const rangeLabel = statsRange ? ` · ${dm(statsRange.start_date)}–${dm(statsRange.end_date)}` : '';
  root.append(el('div', { className: 'card' },
    el('div', { className: 'row', style: 'font-weight:700;margin-bottom:6px' },
      el('div', { className: 'grow' }, '🏆 דירוג מעודכן' + rangeLabel),
      el('button', { className: 'btn ghost sm', type: 'button', onclick: refreshStandings }, '⟳ חשב מחדש'),
    ),
    standBody,
  ));

  // create form
  const qText = el('input', { placeholder: 'שאלת האירוע (למשל: מי יבקיע ראשון?)' });
  const ansWrap = el('div', {});
  const addRow = (t = '', v = '') => {
    const txt = el('input', { className: 'txt', placeholder: 'תשובה' }); txt.value = t;
    const num = el('input', { className: 'num', type: 'number', step: 'any', placeholder: 'ערך' }); num.value = v;
    const row = el('div', { className: 'adm-answer' }, txt, num,
      el('button', { className: 'btn ghost sm', type: 'button', onclick: () => row.remove() }, '✕'));
    ansWrap.append(row);
  };
  addRow(); addRow();
  const createBtn = el('button', { className: 'btn primary', type: 'button' }, 'צור אירוע');
  createBtn.onclick = async () => {
    const answers = [...ansWrap.querySelectorAll('.adm-answer')].map((r) => ({
      text: r.querySelector('.txt').value.trim(),
      value: parseFloat(r.querySelector('.num').value) || 0,
    })).filter((a) => a.text);
    try {
      await api('/api/admin/questions', { method: 'POST', body: { text: qText.value.trim(), event_date: state.date, answers } });
      toast('האירוע נוצר');
      renderEvents(root);
    } catch (e) { toast(e.message, true); }
  };
  if (!isPast) {
    root.append(el('div', { className: 'card' },
      el('div', { style: 'font-weight:700;margin-bottom:8px' }, '➕ אירוע חדש'),
      qText,
      el('label', {}, 'תשובות וערכים'), ansWrap,
      el('div', { className: 'row', style: 'margin:6px 0 12px' },
        el('button', { className: 'btn ghost sm', type: 'button', onclick: () => addRow() }, '+ תשובה')),
      el('div', { className: 'row' }, createBtn),
    ));
  }

  if (!questions.length) { root.append(el('div', { className: 'center' }, 'אין אירועים ליום הזה')); return; }

  // Build one question card. Result-affecting edits update local state,
  // swap just this card, and refresh the standings — no full re-render.
  const buildCard = (q) => {
    const card = el('div', { className: 'card' });
    const swap = () => card.replaceWith(buildCard(q));

    card.append(el('div', { className: 'row' },
      el('div', { className: 'grow', style: 'font-weight:600' }, q.text),
      el('span', { className: 'pill ' + q.status }, { open: 'פתוח', closed: 'סגור', resolved: 'הוכרע' }[q.status]),
    ));

    for (const a of q.answers) {
      const num = el('input', { className: 'num', type: 'number', step: 'any', value: a.value });
      num.onchange = async () => {
        const v = parseFloat(num.value) || 0;
        try {
          await api('/api/admin/answers/' + a.id, { method: 'PATCH', body: { value: v } });
          a.value = v;
          toast('ערך עודכן — הניקוד חושב מחדש');
          swap();
          refreshStandings();
        } catch (e) { toast(e.message, true); }
      };
      const mark = el('button', {
        className: 'btn sm' + (q.correct_answer_id === a.id ? ' primary' : ' ghost'),
        type: 'button',
        disabled: !isPast,
        onclick: async () => {
          try {
            await api('/api/admin/questions/' + q.id, { method: 'PATCH', body: { correct_answer_id: a.id } });
            q.correct_answer_id = a.id;
            toast('✓ התשובה עודכנה — הניקוד חושב מחדש');
            swap();
            refreshStandings();
          } catch (e) { toast(e.message, true); }
        },
      }, q.correct_answer_id === a.id ? '✔ נכונה' : 'סמן נכונה');
      const del = el('button', {
        className: 'btn danger sm', type: 'button',
        onclick: async () => {
          try { await api('/api/admin/answers/' + a.id, { method: 'DELETE' }); renderEvents(root); }
          catch (e) { toast(e.message, true); }
        },
      }, '✕');
      card.append(el('div', { className: 'adm-answer' },
        el('div', { className: 'grow' }, a.text, el('span', { className: 'muted' }, `  (${a.bet_count} הימורים)`)),
        num, mark, del,
      ));
    }

    const addAnsTxt = el('input', { className: 'txt', placeholder: 'תשובה חדשה' });
    const addAnsNum = el('input', { className: 'num', type: 'number', step: 'any', placeholder: 'ערך' });
    card.append(el('div', { className: 'adm-answer' }, addAnsTxt, addAnsNum,
      el('button', {
        className: 'btn ghost sm', type: 'button',
        onclick: async () => {
          if (!addAnsTxt.value.trim()) return;
          try {
            await api('/api/admin/questions/' + q.id + '/answers', { method: 'POST', body: { text: addAnsTxt.value.trim(), value: parseFloat(addAnsNum.value) || 0 } });
            renderEvents(root);
          } catch (e) { toast(e.message, true); }
        },
      }, '+ הוסף')));

    // bettors on this event — pick + change budget, with an unlock action
    const bettors = q._bettors || [];
    if (bettors.length) {
      card.append(el('hr', { className: 'sep' }));
      const bWrap = el('div', {});
      const lockedCount = bettors.filter((b) => b.locked).length;
      bWrap.append(el('div', { style: 'font-weight:600;margin-bottom:6px' },
        `מהמרים (${bettors.length})` + (lockedCount ? ` · ${lockedCount} נעולים` : '')));
      bettors.forEach((bt) => {
        const badge = el('span', {
          className: bt.locked ? 'pill closed' : 'muted',
          style: 'font-size:.72rem;white-space:nowrap',
        }, `${bt.change_count}/3 שינויים${bt.locked ? ' 🔒' : ''}`);
        const row = el('div', { className: 'row wrap-row', style: 'padding:4px 0;font-size:.88rem;border-top:1px solid var(--line)' },
          el('div', { className: 'grow' }, `${bt.icon || '🎲'} ${bt.name}`,
            el('span', { className: 'muted' }, ` · ${bt.answer_text || '—'}`)),
          badge,
        );
        if (bt.locked) {
          row.append(el('button', {
            className: 'btn sm primary', type: 'button',
            onclick: async () => {
              try {
                await api('/api/admin/bets/' + bt.id + '/grant-changes', { method: 'POST' });
                toast(`${bt.name} — נפתחו 3 שינויים נוספים`);
                q._bettors = await api('/api/admin/questions/' + q.id + '/bets').catch(() => q._bettors);
                swap();
              } catch (e) { toast(e.message, true); }
            },
          }, '🔓 פתח ל-3 שינויים'));
        }
        bWrap.append(row);
      });
      card.append(bWrap);
    }

    card.append(el('hr', { className: 'sep' }));
    const statusSel = el('select', { style: 'width:auto' });
    for (const s of ['open', 'closed', 'resolved']) {
      const o = el('option', { value: s }, { open: 'פתוח', closed: 'סגור להימורים', resolved: 'הוכרע' }[s]);
      if (s === q.status) o.selected = true;
      if (s === 'resolved' && !isPast && q.status !== 'resolved') o.disabled = true;
      statusSel.append(o);
    }
    statusSel.onchange = async () => {
      const v = statusSel.value;
      try {
        await api('/api/admin/questions/' + q.id, { method: 'PATCH', body: { status: v } });
        q.status = v;
        toast(v === 'resolved' ? 'הוכרע — הניקוד חושב מחדש' : 'סטטוס עודכן');
        swap();
        refreshStandings();
      } catch (e) { toast(e.message, true); statusSel.value = q.status; }
    };
    card.append(el('div', { className: 'row' },
      statusSel, el('div', { className: 'grow' }),
      el('button', {
        className: 'btn danger sm', type: 'button',
        onclick: async () => {
          if (!confirm('למחוק את האירוע וכל ההימורים עליו?')) return;
          try { await api('/api/admin/questions/' + q.id, { method: 'DELETE' }); renderEvents(root); }
          catch (e) { toast(e.message, true); }
        },
      }, 'מחק אירוע'),
    ));
    if (q.status === 'resolved' && !q.correct_answer_id) {
      card.append(el('div', { style: 'color:var(--bad);margin-top:6px', className: 'muted' }, '⚠ סמן תשובה נכונה כדי לחשב ניקוד'));
    }
    if (!isPast) {
      card.append(el('div', { className: 'muted', style: 'margin-top:6px' }, '⏳ ניתן להגדיר תוצאה רק החל מהיום שאחרי האירוע'));
    }
    return card;
  };

  for (const q of questions) root.append(buildCard(q));
}

// ---------------- stats tab ----------------
async function renderStats(root) {
  root.innerHTML = '';
  root.append(el('h2', {}, 'סטטיסטיקת מהמרים'), el('div', { className: 'center' }, 'טוען…'));

  let data;
  try { data = await api('/api/admin/stats'); }
  catch (e) { toast(e.message, true); return; }

  const { range, rows } = data;
  root.innerHTML = '';
  root.append(el('h2', {}, 'סטטיסטיקת מהמרים'));

  const dShort = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric' });
  root.append(el('p', { className: 'muted', style: 'margin-top:0' },
    `מיום שישי ${dShort(range.start_date)} עד ${dShort(range.end_date)} · ${rows.length} מהמרים פעילים`));

  const active = rows.filter((r) => r.bets > 0);
  if (!active.length) {
    root.append(el('div', { className: 'center' }, 'אין הימורים בטווח הזה'));
    return;
  }

  // icon crowd — sized by score rank within the window
  const maxScore = Math.max(...active.map((r) => r.score), 1);
  const faces = el('div', { className: 'stat-faces' });
  active.forEach((r, i) => {
    const sz = (44 + 30 * (r.score / maxScore)).toFixed(0);
    const face = el('div', { className: 'stat-face' + (i === 0 && r.score > 0 ? ' leader' : '') },
      el('div', { className: 'badge', style: `--sz:${sz}px` },
        i === 0 && r.score > 0 ? el('span', { className: 'crown' }, '👑') : '',
        r.icon || '🎲'),
      el('div', { className: 'nm' }, r.name),
      el('div', { className: 'sc' + (r.score > 0 ? '' : ' zero') }, fmt(r.score) + ' נק\''),
    );
    faces.append(face);
  });
  root.append(el('div', { className: 'card' }, faces));

  // detail table
  const tbl = el('table');
  tbl.append(el('tr', {},
    el('th', {}, '#'), el('th', {}, 'מהמר'), el('th', {}, 'הימורים'),
    el('th', {}, 'הוכרעו'), el('th', {}, 'פגיעות'), el('th', {}, 'אחוז הצלחה'),
    el('th', {}, 'ממתינים'), el('th', {}, 'נקודות'),
  ));
  active.forEach((r, i) => {
    const pct = r.resolved ? Math.round((r.hits / r.resolved) * 100) + '%' : '—';
    tbl.append(el('tr', {},
      el('td', { className: 'muted' }, String(i + 1)),
      el('td', {}, `${r.icon || '🎲'} ${r.name}`),
      el('td', {}, String(r.bets)),
      el('td', { className: 'muted' }, String(r.resolved)),
      el('td', {}, String(r.hits)),
      el('td', {}, pct),
      el('td', { className: 'muted' }, String(r.pending)),
      el('td', { style: 'font-weight:800;font-variant-numeric:tabular-nums' }, fmt(r.score)),
    ));
  });
  root.append(el('div', { className: 'card tbl-scroll' }, tbl));

  const idle = rows.filter((r) => r.bets === 0);
  if (idle.length) {
    root.append(el('div', { className: 'card muted' },
      'לא הימרו בטווח: ' + idle.map((r) => r.name).join(', ')));
  }
}

// ---------------- bets tab ----------------
async function renderBets(root) {
  root.innerHTML = '';
  root.append(el('h2', {}, 'הימורים לפי מהמר'), el('div', { className: 'center' }, 'טוען…'));

  let rows;
  try { rows = await api('/api/admin/bets'); }
  catch (e) { toast(e.message, true); return; }

  root.innerHTML = '';
  root.append(el('h2', {}, 'הימורים לפי מהמר'));

  if (!rows.length) {
    root.append(el('div', { className: 'center' }, 'אין הימורים עדיין'));
    return;
  }

  // group bets by bettor, preserving the server's name order
  const groups = [];
  const byId = new Map();
  for (const b of rows) {
    let g = byId.get(b.user_id);
    if (!g) { g = { user_id: b.user_id, name: b.user_name, username: b.username, icon: b.icon, bets: [] }; byId.set(b.user_id, g); groups.push(g); }
    g.bets.push(b);
  }

  root.append(el('p', { className: 'muted', style: 'margin-top:0' },
    `${groups.length} מהמרים · ${rows.length} הימורים סה"כ`));

  for (const g of groups) {
    const hits = g.bets.filter((b) => b.is_hit).length;
    const resolved = g.bets.filter((b) => b.resolved).length;
    const score = g.bets.reduce((s, b) => s + (b.is_hit ? b.value : 0), 0);

    const tbl = el('table');
    tbl.append(el('tr', {},
      el('th', {}, 'תאריך'), el('th', {}, 'שאלה'),
      el('th', {}, 'ההימור'), el('th', {}, 'ערך'), el('th', {}, 'תוצאה'),
    ));
    for (const b of g.bets) {
      let outcome, cls = 'muted';
      if (!b.resolved) { outcome = b.status === 'open' ? 'ממתין' : 'טרם הוכרע'; }
      else if (b.is_hit) { outcome = '✓ פגע'; cls = ''; }
      else { outcome = '✗ החמיץ' + (b.correct_answer_text ? ` (${b.correct_answer_text})` : ''); }
      tbl.append(el('tr', {},
        el('td', { className: 'muted', style: 'white-space:nowrap' }, b.event_date ? heDate(b.event_date) : '—'),
        el('td', {}, b.question_text),
        el('td', { style: 'font-weight:600' }, b.answer_text),
        el('td', { className: 'muted', style: 'font-variant-numeric:tabular-nums' }, fmt(b.value)),
        el('td', { className: cls, style: b.resolved && b.is_hit ? 'color:var(--good)' : (b.resolved ? 'color:var(--bad)' : '') }, outcome),
      ));
    }

    root.append(el('div', { className: 'card' },
      el('div', { className: 'row', style: 'font-weight:700;margin-bottom:4px' },
        el('div', { className: 'grow' }, `${g.icon || '🎲'} ${g.name}`),
        el('div', { className: 'muted', style: 'font-size:.8rem' },
          `${g.bets.length} הימורים · ${hits}/${resolved} פגיעות`),
        el('div', { style: 'font-weight:800;font-variant-numeric:tabular-nums;width:52px;text-align:left' }, fmt(score)),
      ),
      el('div', { className: 'tbl-scroll' }, tbl),
    ));
  }
}

// ---------------- users tab ----------------
async function renderUsers(root) {
  root.innerHTML = '';
  root.append(el('h2', {}, 'ניהול משתמשים'), el('div', { className: 'center' }, 'טוען…'));

  let users;
  try { users = await api('/api/admin/users'); }
  catch (e) { toast(e.message, true); return; }

  root.innerHTML = '';
  root.append(el('h2', {}, 'ניהול משתמשים'));

  const admins = users.filter((u) => u.is_admin);
  const bettors = users.filter((u) => !u.is_admin);

  const addForm = (asAdmin) => {
    const nI = el('input', { placeholder: 'שם מלא' });
    const uI = el('input', { placeholder: 'שם משתמש', autocapitalize: 'off' });
    const pI = el('input', { placeholder: 'סיסמה', type: 'text' });
    const btn = el('button', { className: 'btn primary', type: 'button' }, asAdmin ? 'הוסף מנהל' : 'הוסף מהמר');
    btn.onclick = async () => {
      try {
        await api('/api/admin/users', { method: 'POST', body: {
          name: nI.value.trim(), username: uI.value.trim(), password: pI.value, is_admin: asAdmin,
        } });
        toast(asAdmin ? 'מנהל נוצר' : 'מהמר נוצר');
        renderUsers(root);
      } catch (e) { toast(e.message, true); }
    };
    return el('div', { className: 'card' },
      el('div', { style: 'font-weight:700;margin-bottom:8px' }, asAdmin ? '➕ מנהל חדש' : '➕ מהמר חדש'),
      el('div', { className: 'row wrap-row' },
        el('div', { className: 'grow' }, el('label', {}, 'שם'), nI),
        el('div', { className: 'grow' }, el('label', {}, 'שם משתמש'), uI),
        el('div', { className: 'grow' }, el('label', {}, 'סיסמה'), pI),
      ),
      el('div', { className: 'row', style: 'margin-top:12px' }, btn),
    );
  };

  const table = (list, asAdmin) => {
    const head = [el('th', {}, '#'), el('th', {}, 'שם'), el('th', {}, 'משתמש'), el('th', {}, 'אייקון')];
    if (!asAdmin) head.push(el('th', {}, 'הימורים'), el('th', {}, 'סטטוס'));
    head.push(el('th', {}, 'פעולות'));
    const tbl = el('table');
    tbl.append(el('tr', {}, ...head));
    if (!list.length) tbl.append(el('tr', {}, el('td', { className: 'muted', colSpan: head.length }, '— אין —')));

    for (const u of list) {
      const isMe = u.id === state.user.id;
      const mk = (label, cls, fn) => el('button', { className: 'btn sm ' + cls, type: 'button', onclick: fn }, label);
      const renameBtn = mk('שנה שם', 'ghost', async () => {
        const nn = prompt('שם חדש:', u.name);
        if (!nn || nn.trim() === u.name) return;
        try { await api('/api/admin/users/' + u.id, { method: 'PATCH', body: { name: nn.trim() } }); renderUsers(root); }
        catch (e) { toast(e.message, true); }
      });
      const resetBtn = mk('איפוס סיסמה', 'ghost', async () => {
        const np = prompt('סיסמה חדשה עבור ' + u.username + ':');
        if (!np) return;
        try { await api('/api/admin/users/' + u.id, { method: 'PATCH', body: { password: np } }); toast('הסיסמה אופסה'); }
        catch (e) { toast(e.message, true); }
      });
      const moveBtn = el('button', {
        className: 'btn sm ghost', type: 'button', disabled: isMe,
        onclick: async () => {
          if (!confirm(`להעביר את ${u.name} ל${asAdmin ? 'מהמרים' : 'מנהלים'}?`)) return;
          try { await api('/api/admin/users/' + u.id, { method: 'PATCH', body: { is_admin: !asAdmin } }); renderUsers(root); }
          catch (e) { toast(e.message, true); }
        },
      }, asAdmin ? '↓ העבר למהמרים' : '↑ הפוך למנהל');
      const delBtn = el('button', {
        className: 'btn danger sm', type: 'button', disabled: isMe,
        onclick: async () => {
          if (!confirm(`למחוק את ${u.name}${asAdmin ? '' : ' וכל ההימורים שלו'}?`)) return;
          try { await api('/api/admin/users/' + u.id, { method: 'DELETE' }); renderUsers(root); }
          catch (e) { toast(e.message, true); }
        },
      }, 'מחק');
      // bettors can be deactivated: no login, hidden from the app roster/icons
      const activeBtn = el('button', {
        className: 'btn sm ' + (u.active ? 'ghost' : 'primary'), type: 'button', disabled: isMe,
        onclick: async () => {
          const next = !u.active;
          if (next === false && !confirm(`להשבית את ${u.name}? הוא לא יוכל להיכנס לאפליקציה ולא יוצג בה.`)) return;
          try {
            await api('/api/admin/users/' + u.id, { method: 'PATCH', body: { active: next } });
            toast(next ? 'הופעל' : 'הושבת');
            renderUsers(root);
          } catch (e) { toast(e.message, true); }
        },
      }, u.active ? '⏸ השבת' : '▶ הפעל');
      const iconSel = el('select', { style: 'width:auto;font-size:1.05rem;padding:6px 8px' });
      iconSel.append(el('option', { value: '' }, '🎲'));
      for (const ic of USER_ICONS) {
        const o = el('option', { value: ic }, ic);
        if (u.icon === ic) o.selected = true;
        iconSel.append(o);
      }
      iconSel.onchange = async () => {
        try { await api('/api/admin/users/' + u.id, { method: 'PATCH', body: { icon: iconSel.value } }); toast('האייקון עודכן'); }
        catch (e) { toast(e.message, true); }
      };
      const cells = [
        el('td', {}, String(u.id)),
        el('td', {}, u.name + (isMe ? ' (אתה)' : '')),
        el('td', { className: 'muted' }, u.username || '—'),
        el('td', {}, iconSel),
      ];
      const actions = [renameBtn, resetBtn, moveBtn, delBtn];
      if (!asAdmin) {
        cells.push(el('td', { className: 'muted' }, String(u.bets_count)));
        cells.push(el('td', {}, el('span', {
          className: 'pill ' + (u.active ? 'open' : 'closed'),
        }, u.active ? 'פעיל' : 'מושבת')));
        actions.splice(3, 0, activeBtn);
      }
      cells.push(el('td', {}, el('div', { className: 'row wrap-row' }, ...actions)));
      tbl.append(el('tr', { style: (!asAdmin && !u.active) ? 'opacity:.5' : '' }, ...cells));
    }
    return el('div', { className: 'card tbl-scroll' }, tbl);
  };

  root.append(
    el('div', { style: 'font-weight:800;color:var(--gold);margin:6px 0' }, `👑 מנהלי המערכת (${admins.length})`),
    el('p', { className: 'muted', style: 'margin-top:0' }, 'חשבונות ניהול בלבד — לא משתתפים בהימורים ולא מופיעים בטבלת הדירוג.'),
    addForm(true),
    table(admins, true),
    el('hr', { className: 'sep', style: 'margin:20px 0' }),
    el('div', { style: 'font-weight:800;margin:6px 0' }, `🎯 מהמרים (${bettors.length})`),
    addForm(false),
    table(bettors, false),
  );
}

// ---------------- init ----------------
(async () => {
  try {
    const me = await api('/api/auth/me');
    if (!me) return renderGate();
    if (!me.is_admin) return renderGate('החשבון ' + me.name + ' אינו מנהל. התחבר עם חשבון ניהול.');
    state.user = me;
    boot();
  } catch { renderGate(); }
})();
</script>
