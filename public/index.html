<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בטון · הימורים</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface-2: #334155;
    --line: #475569;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-ink: #04222e;
    --good: #4ade80;
    --bad: #f87171;
    --gold: #fbbf24;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    background: #020617;
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    position: relative;
  }
  header {
    padding: 14px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header .brand { font-weight: 800; letter-spacing: .5px; }
  header .who { font-size: .8rem; color: var(--muted); }
  main { flex: 1; padding: 16px; padding-bottom: 88px; }
  nav.tabs {
    position: fixed;
    bottom: 0;
    width: 100%;
    max-width: 480px;
    display: flex;
    background: var(--surface);
    border-top: 1px solid var(--line);
  }
  nav.tabs button {
    flex: 1;
    padding: 12px 4px;
    background: none;
    border: 0;
    color: var(--muted);
    font-size: .78rem;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
  }
  nav.tabs button.active { color: var(--accent); }
  nav.tabs button .ico { font-size: 1.2rem; }

  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .muted { color: var(--muted); font-size: .85rem; }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; }

  input, select {
    width: 100%;
    padding: 11px 12px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font: inherit;
  }
  input::placeholder { color: var(--muted); }
  label { display: block; font-size: .8rem; color: var(--muted); margin: 10px 0 4px; }

  button.btn {
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.btn.ghost { background: none; }
  button.btn.danger { color: var(--bad); border-color: var(--bad); background: none; }
  button.btn:disabled { opacity: .5; }
  button.btn.sm { padding: 7px 10px; font-size: .82rem; }

  .answers { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .answer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--text);
    font: inherit;
    text-align: start;
    cursor: pointer;
  }
  .answer .val {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    color: var(--muted);
    background: var(--bg);
    border-radius: 999px;
    padding: 2px 9px;
    font-size: .82rem;
  }
  .answer.picked { border-color: var(--accent); background: rgba(56,189,248,.14); }
  .answer.picked .val { color: var(--accent); }
  .answer.correct { border-color: var(--good); background: rgba(74,222,128,.14); }
  .answer.correct .val { color: var(--good); }
  .answer.wrongpick { border-color: var(--bad); background: rgba(248,113,113,.12); }
  .answer:disabled { cursor: default; }

  .pill {
    display: inline-block;
    font-size: .72rem;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--muted);
  }
  .pill.open { color: var(--good); border-color: var(--good); }
  .pill.closed { color: var(--gold); border-color: var(--gold); }
  .pill.resolved { color: var(--accent); border-color: var(--accent); }

  .datebar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 8px; }
  .datebar .d { font-weight: 700; }

  .lb-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 6px;
    border-bottom: 1px solid var(--line);
  }
  .lb-row:last-child { border-bottom: 0; }
  .lb-rank { width: 26px; text-align: center; font-weight: 800; color: var(--muted); }
  .lb-row.me { background: rgba(56,189,248,.1); border-radius: 10px; }
  .lb-row .lb-score { margin-inline-start: auto; font-weight: 800; font-variant-numeric: tabular-nums; }
  .lb-row:nth-child(1) .lb-rank { color: var(--gold); }

  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: .85rem;
    z-index: 50;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
    max-width: 90%;
  }
  .toast.show { opacity: 1; }
  .toast.err { border-color: var(--bad); color: #fecaca; }

  .center { text-align: center; padding: 40px 10px; color: var(--muted); }

  /* comic strip of every user in the system, top of the login page */
  .faces {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end;
    gap: 10px 14px; padding: 30px 8px 6px; min-height: 40px;
  }
  .face-chip {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    animation: crowd-pop .45s cubic-bezier(.2,1.6,.4,1) both,
               crowd-bob var(--dur, 4s) ease-in-out infinite;
    animation-delay: var(--pop, 0s), var(--delay, 0s);
  }
  .face-chip .face-wrap { position: relative; display: flex; }
  .face-chip .face {
    font-size: var(--size, 1.9rem); line-height: 1;
    transform: rotate(var(--tilt, 0deg));
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.55));
  }
  .face-chip .crown {
    position: absolute; top: -.5em; left: 50%;
    font-size: calc(var(--size, 1.9rem) * .6);
    transform: translateX(-50%) rotate(-14deg);
    pointer-events: none;
  }
  .face-chip .tag {
    font-size: .62rem; font-weight: 700; color: var(--text);
    background: rgba(2,6,23,.82); border: 1px solid var(--line);
    padding: 1px 6px; border-radius: 999px;
    max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .face-chip.leader .face { filter: drop-shadow(0 0 10px rgba(251,191,36,.7)); }
  .face-chip.leader .tag { color: var(--gold); border-color: var(--gold); }
  @keyframes crowd-bob {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-9px) rotate(3deg); }
  }
  @keyframes crowd-pop { from { transform: scale(0) rotate(-40deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .face-chip { animation: crowd-pop .3s both; }
  }

  @media (min-width: 481px) {
    body { align-items: center; padding: 20px 0; background: #020617; }
    #app { border-radius: 22px; overflow: hidden; min-height: min(880px, 92vh); box-shadow: 0 30px 80px rgba(0,0,0,.5); }
    nav.tabs { position: sticky; }
  }
</style>
</head>
<body>
<div id="app">
  <header id="hdr" hidden>
    <div>
      <div class="brand">בטון 🏗️</div>
      <div class="who" id="who"></div>
    </div>
    <div class="row" style="gap:6px">
      <a class="btn ghost sm" id="adminLink" href="/admin.html" hidden>ניהול ⚙️</a>
      <button class="btn ghost sm" id="logoutBtn" type="button">↩ התנתקות</button>
    </div>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs" hidden></nav>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  for (const k of kids.flat()) n.append(k?.nodeType ? k : document.createTextNode(k ?? ''));
  return n;
};
const api = async (path, opts = {}) => {
  const res = await fetch(path, {
    headers: opts.body ? { 'Content-Type': 'application/json' } : {},
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = res.status === 204 ? null : await res.json().catch(() => null);
  if (!res.ok) throw new Error(data?.error || `שגיאה ${res.status}`);
  return data;
};
let toastT;
const toast = (msg, isErr = false) => {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toastT);
  toastT = setTimeout(() => (t.className = 'toast'), 2200);
};
const fmt = (n) => (n > 0 ? '+' : '') + (Math.round(n * 100) / 100);
const todayISO = () => new Date().toLocaleDateString('sv-SE'); // YYYY-MM-DD local
const heDate = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('he-IL', { weekday: 'short', day: 'numeric', month: 'numeric' });

const state = { user: null, tab: 'bets', date: todayISO() };

// ---------------- Auth screen ----------------
function renderAuth() {
  $('#hdr').hidden = true;
  $('#tabs').hidden = true;
  const view = $('#view');
  view.innerHTML = '';
  let mode = 'login';

  const DEFAULT_USER = { username: 'yossi', password: 'beton123' };
  const DEMO_USERS = [
    { username: 'yossi', password: 'beton123', label: 'yossi · מנהל' },
    { username: 'dana', password: 'beton123', label: 'dana' },
    { username: 'avi', password: 'beton123', label: 'avi' },
  ];

  const nameI = el('input', { placeholder: 'שם מלא' });
  const userI = el('input', { placeholder: 'שם משתמש', autocapitalize: 'off', autocorrect: 'off', value: DEFAULT_USER.username });
  const passI = el('input', { placeholder: 'סיסמה', type: 'password', value: DEFAULT_USER.password });
  const nameWrap = el('div', {}, el('label', {}, 'שם'), nameI);
  const submit = el('button', { className: 'btn primary grow' });
  const toggle = el('button', { className: 'btn ghost grow' });

  const fill = (u) => { userI.value = u.username; passI.value = u.password; };
  const demoWrap = el('div', { style: 'margin-top:12px' },
    el('label', {}, 'משתמשי ברירת מחדל'),
    el('div', { className: 'row', style: 'flex-wrap:wrap;gap:6px' },
      ...DEMO_USERS.map((u) =>
        el('button', {
          className: 'btn ghost sm',
          onclick: () => { fill(u); toast('מולא: ' + u.username); },
        }, u.label)),
    ),
  );

  const paint = () => {
    submit.textContent = mode === 'login' ? 'כניסה' : 'הרשמה';
    toggle.textContent = mode === 'login' ? 'אין לי חשבון' : 'יש לי חשבון';
    nameWrap.hidden = mode === 'login';
    demoWrap.hidden = mode !== 'login';
    if (mode === 'login' && !userI.value) fill(DEFAULT_USER);
  };
  paint();

  toggle.onclick = () => { mode = mode === 'login' ? 'register' : 'login'; paint(); };
  submit.onclick = async () => {
    try {
      const body = { username: userI.value.trim(), password: passI.value };
      if (mode === 'register') body.name = nameI.value.trim();
      const path = mode === 'login' ? '/api/auth/login' : '/api/auth/register';
      state.user = await api(path, { method: 'POST', body });
      boot();
    } catch (e) { toast(e.message, true); }
  };

  const faces = el('div', { className: 'faces' });
  renderLoginFaces(faces);

  view.append(
    faces,
    el('div', { className: 'center', style: 'font-size:2.6rem;padding-bottom:8px' }, '🏗️'),
    el('h2', { style: 'text-align:center' }, 'בטון · הימורי אירועים'),
    el('p', { className: 'muted', style: 'text-align:center;margin-top:-4px' }, 'התחבר כדי להמר על אירועי היום'),
    el('div', { className: 'card' },
      nameWrap,
      el('label', {}, 'שם משתמש'), userI,
      el('label', {}, 'סיסמה'), passI,
      el('div', { className: 'row', style: 'margin-top:16px' }, submit),
      el('div', { className: 'row', style: 'margin-top:8px' }, toggle),
      demoWrap,
    ),
  );
}

// ---------------- Tabs / shell ----------------
function renderTabs() {
  const tabs = $('#tabs');
  tabs.hidden = false;
  tabs.innerHTML = '';
  const defs = [
    { id: 'bets', label: 'הימורים', ico: '🎯' },
    { id: 'board', label: 'טבלה', ico: '🏆' },
  ];
  for (const d of defs) {
    tabs.append(el('button', {
      className: state.tab === d.id ? 'active' : '',
      onclick: () => { state.tab = d.id; route(); },
    }, el('span', { className: 'ico' }, d.ico), d.label));
  }
}

function route() {
  renderTabs();
  if (state.tab === 'bets') renderBets();
  else if (state.tab === 'board') renderBoard();
}

// ---------------- comic strip of all users (login page) ----------------
const CROWD_FACES = ['🤪','😜','🤠','🥸','🤓','😎','🙃','🤡','👻','🐸','🦖','👽','🤖','🥳','😹','🐵','🦄','🐙'];
const seeded = (n) => { const x = Math.sin(n) * 43758.5453; return x - Math.floor(x); };

async function renderLoginFaces(container) {
  let users;
  try { users = await api('/api/users'); } catch { return; }
  container.innerHTML = '';

  // size by leaderboard rank (leader biggest + crown), display in random order
  const rankById = new Map(
    [...users].sort((a, b) => b.score - a.score).map((u, i) => [u.id, i])
  );
  const n = users.length;
  const shuffled = users.map((u) => u).sort(() => Math.random() - 0.5);

  shuffled.forEach((u) => {
    const rank = rankById.get(u.id);
    const t = n > 1 ? rank / (n - 1) : 0;           // 0 = leader … 1 = last
    const size = (3.1 - t * 1.9).toFixed(2);        // rem: 3.1 → 1.2
    const isLeader = rank === 0;
    const dur = (3 + seeded(u.id * 5 + 4) * 3).toFixed(2);
    const delay = (seeded(u.id * 11 + 6) * -6).toFixed(2);
    const pop = (Math.random() * 0.6).toFixed(2);
    const tilt = Math.round(seeded(u.id * 13 + 8) * 20 - 10);
    const face = u.icon || CROWD_FACES[Math.floor(seeded(u.id * 17 + 9) * CROWD_FACES.length)];
    const faceWrap = el('div', { className: 'face-wrap' }, el('div', { className: 'face' }, face));
    if (isLeader) faceWrap.prepend(el('span', { className: 'crown' }, '👑'));
    container.append(el('div', {
      className: 'face-chip' + (isLeader ? ' leader' : ''),
      style: `--size:${size}rem;--dur:${dur}s;--delay:${delay}s;--pop:${pop}s;--tilt:${tilt}deg`,
      title: `${u.name} · ${fmt(u.score)} נק'`,
    },
      faceWrap,
      el('div', { className: 'tag' }, u.name),
    ));
  });
}

function dateBar(onChange, { maxDate } = {}) {
  if (maxDate && state.date > maxDate) state.date = maxDate;
  const shift = (days) => {
    const d = new Date(state.date + 'T00:00:00');
    d.setDate(d.getDate() + days);
    const next = d.toLocaleDateString('sv-SE');
    if (maxDate && next > maxDate) return;
    state.date = next;
    onChange();
  };
  const picker = el('input', { type: 'date', value: state.date, style: 'width:auto' });
  if (maxDate) picker.max = maxDate;
  picker.onchange = () => {
    state.date = maxDate && picker.value > maxDate ? maxDate : picker.value;
    onChange();
  };
  const atMax = maxDate && state.date >= maxDate;
  return el('div', { className: 'datebar' },
    el('button', { className: 'btn sm', onclick: () => shift(-1) }, '‹ אתמול'),
    picker,
    el('button', { className: 'btn sm', disabled: atMax, onclick: () => shift(1) }, 'מחר ›'),
  );
}

// ---------------- Bets screen ----------------
async function renderBets() {
  $('#hdr').hidden = false;
  const view = $('#view');
  view.innerHTML = '';
  view.append(el('h2', {}, 'אירועי היום'), dateBar(renderBets, { maxDate: todayISO() }), el('div', { className: 'center' }, 'טוען…'));
  let questions;
  try {
    questions = await api('/api/questions?date=' + state.date);
  } catch (e) { toast(e.message, true); return; }

  const isToday = state.date === todayISO();

  view.innerHTML = '';
  view.append(el('h2', {}, 'אירועים · ' + heDate(state.date)), dateBar(renderBets, { maxDate: todayISO() }));
  if (!isToday) {
    view.append(el('div', { className: 'card muted' }, '👁️ צפייה בלבד — ניתן להמר רק על אירועי היום.'));
  }

  if (!questions.length) {
    view.append(el('div', { className: 'center' }, 'אין אירועים ליום הזה 🤷'), logoutFooter());
    return;
  }

  for (const q of questions) {
    const card = el('div', { className: 'card' });
    card.append(el('div', { className: 'row' },
      el('div', { className: 'grow', style: 'font-weight:600' }, q.text),
      el('span', { className: 'pill ' + q.status }, { open: 'פתוח', closed: 'סגור', resolved: 'הוכרע' }[q.status]),
    ));

    const box = el('div', { className: 'answers' });
    for (const a of q.answers) {
      const picked = q.my_answer_id === a.id;
      const isCorrect = q.status === 'resolved' && q.correct_answer_id === a.id;
      const wrongPick = q.status === 'resolved' && picked && !isCorrect;
      const btn = el('button', {
        className: 'answer' + (picked ? ' picked' : '') + (isCorrect ? ' correct' : '') + (wrongPick ? ' wrongpick' : ''),
        disabled: q.status !== 'open' || !isToday,
      },
        el('span', {}, a.text + (picked ? '  ✓' : '')),
        el('span', { className: 'val' }, fmt(a.value)),
      );
      if (q.status === 'open' && isToday) {
        btn.onclick = async () => {
          try {
            await api('/api/bets', { method: 'POST', body: { question_id: q.id, answer_id: a.id } });
            q.my_answer_id = a.id;
            renderBets();
            toast('ההימור נשמר');
          } catch (e) { toast(e.message, true); }
        };
      }
      box.append(btn);
    }
    card.append(box);

    if (q.status === 'resolved' && q.my_answer_id != null) {
      const hit = q.my_answer_id === q.correct_answer_id;
      const gained = hit ? q.answers.find((a) => a.id === q.correct_answer_id)?.value ?? 0 : 0;
      card.append(el('div', { className: 'muted', style: 'margin-top:8px' },
        hit ? `פגעת! ${fmt(gained)} נקודות` : 'החמצת בשאלה הזו'));
    } else if (q.status !== 'open' && q.my_answer_id == null) {
      card.append(el('div', { className: 'muted', style: 'margin-top:8px' }, 'לא הימרת על השאלה הזו'));
    }
    view.append(card);
  }
  view.append(logoutFooter());
}

const logoutFooter = () => el('div', { style: 'margin-top:24px' },
  el('button', { className: 'btn ghost', style: 'width:100%', type: 'button', onclick: logout }, '↩ התנתקות'));

// ---------------- Leaderboard ----------------
async function renderBoard() {
  $('#hdr').hidden = false;
  const view = $('#view');
  view.innerHTML = '';
  view.append(el('h2', {}, 'טבלת דירוג'), el('div', { className: 'center' }, 'טוען…'));
  let rows;
  try { rows = await api('/api/leaderboard'); }
  catch (e) { toast(e.message, true); return; }

  view.innerHTML = '';
  view.append(el('h2', {}, 'טבלת דירוג 🏆'));
  const card = el('div', { className: 'card' });
  rows.forEach((r, i) => {
    card.append(el('div', { className: 'lb-row' + (r.id === state.user.id ? ' me' : '') },
      el('div', { className: 'lb-rank' }, String(i + 1)),
      el('div', {},
        el('div', { style: 'font-weight:600' }, r.name),
        el('div', { className: 'muted' }, `${r.hits} פגיעות · ${r.bets_count} הימורים`),
      ),
      el('div', { className: 'lb-score' }, fmt(r.score)),
    ));
  });
  view.append(card);
  view.append(el('p', { className: 'muted', style: 'text-align:center' }, 'הניקוד = סכום הערכים של התשובות הנכונות שבחרת'));
}


// ---------------- boot ----------------
function boot() {
  $('#who').textContent = state.user.name + (state.user.is_admin ? ' · מנהל' : '');
  $('#adminLink').hidden = !state.user.is_admin;
  route();
}
async function logout() {
  await api('/api/auth/logout', { method: 'POST' }).catch(() => {});
  state.user = null;
  renderAuth();
}
$('#logoutBtn').onclick = logout;

(async () => {
  try {
    const me = await api('/api/auth/me');
    if (me) { state.user = me; boot(); } else renderAuth();
  } catch { renderAuth(); }
})();
</script>
</body>
</html>
