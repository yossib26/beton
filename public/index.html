<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      font-family: system-ui, sans-serif;
      background: #f4f4f5;
      color: #18181b;
    }
    h1 { font-size: 3rem; margin: 0; }
    section {
      background: #fff;
      border: 1px solid #e4e4e7;
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      min-width: 320px;
    }
    h2 { font-size: 1rem; margin: 0 0 .75rem; color: #52525b; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { padding: .4rem 0; border-bottom: 1px solid #f4f4f5; }
    li:last-child { border-bottom: 0; }
    .email { color: #71717a; font-size: .85rem; }
    form { display: flex; gap: .5rem; margin-top: .75rem; }
    input { flex: 1; padding: .4rem .6rem; border: 1px solid #d4d4d8; border-radius: 8px; font: inherit; }
    button { padding: .4rem .9rem; border: 0; border-radius: 8px; background: #18181b; color: #fff; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Hello</h1>
  <section>
    <h2>משתמשים</h2>
    <ul id="users"></ul>
    <form id="add">
      <input name="name" placeholder="שם" required>
      <input name="email" type="email" placeholder="אימייל" required>
      <button type="submit">הוסף</button>
    </form>
  </section>
  <script>
    const list = document.getElementById('users');

    async function load() {
      const res = await fetch('/api/users');
      const users = await res.json();
      list.innerHTML = users.map(u =>
        `<li>${u.name} <span class="email">${u.email}</span></li>`
      ).join('') || '<li class="email">אין משתמשים עדיין</li>';
    }

    document.getElementById('add').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      const res = await fetch('/api/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      if (res.ok) { e.target.reset(); load(); }
      else alert('שגיאה: ' + (await res.json()).error);
    });

    load();
  </script>
</body>
</html>
