<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BetOn · הימורים</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface-2: #334155;
    --line: #475569;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-ink: #04222e;
    --good: #4ade80;
    --bad: #f87171;
    --gold: #fbbf24;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    background: #020617;
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    position: relative;
  }
  header {
    padding: 14px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header .brand { font-weight: 800; letter-spacing: .5px; }
  header .who { font-size: .8rem; color: var(--muted); }
  main { flex: 1; padding: 16px; padding-bottom: 88px; }
  nav.tabs {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    display: flex;
    background: var(--surface);
    border-top: 1px solid var(--line);
  }
  nav.tabs button {
    flex: 1;
    padding: 12px 4px;
    background: none;
    border: 0;
    color: var(--muted);
    font-size: .78rem;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
  }
  nav.tabs button.active { color: var(--accent); }
  nav.tabs button .ico { font-size: 1.2rem; }

  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .muted { color: var(--muted); font-size: .85rem; }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; }

  input, select {
    width: 100%;
    padding: 11px 12px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font: inherit;
  }
  input::placeholder { color: var(--muted); }
  label { display: block; font-size: .8rem; color: var(--muted); margin: 8px 0 3px; }
  label:first-child { margin-top: 0; }

  button.btn {
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.btn.ghost { background: none; }
  button.btn.danger { color: var(--bad); border-color: var(--bad); background: none; }
  button.btn:disabled { opacity: .5; }
  button.btn.sm { padding: 7px 10px; font-size: .82rem; }

  .answers { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .answer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--text);
    font: inherit;
    text-align: start;
    cursor: pointer;
  }
  .answer .val {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    color: var(--muted);
    background: var(--bg);
    border-radius: 999px;
    padding: 2px 9px;
    font-size: .82rem;
  }
  .answer.picked { border-color: var(--accent); background: rgba(56,189,248,.14); }
  .answer.picked .val { color: var(--accent); }
  .answer.correct { border-color: var(--good); background: rgba(74,222,128,.14); }
  .answer.correct .val { color: var(--good); }
  .answer.wrongpick { border-color: var(--bad); background: rgba(248,113,113,.12); }
  .answer:disabled { cursor: default; }

  .pill {
    display: inline-block;
    font-size: .72rem;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--muted);
  }
  .pill.open { color: var(--good); border-color: var(--good); }
  .pill.closed { color: var(--gold); border-color: var(--gold); }
  .pill.resolved { color: var(--accent); border-color: var(--accent); }

  .datebar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 8px; }
  .datebar .d { font-weight: 700; }

  .lb-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 6px;
    border-bottom: 1px solid var(--line);
  }
  .lb-row:last-child { border-bottom: 0; }
  .lb-rank { width: 26px; text-align: center; font-weight: 800; color: var(--muted); }
  .lb-row.me { background: rgba(56,189,248,.1); border-radius: 10px; }
  .lb-row .lb-score { margin-inline-start: auto; font-weight: 800; font-variant-numeric: tabular-nums; }
  .lb-row:nth-child(1) .lb-rank { color: var(--gold); }

  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: .85rem;
    z-index: 50;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
    max-width: 90%;
  }
  .toast.show { opacity: 1; }
  .toast.err { border-color: var(--bad); color: #fecaca; }

  .popup-overlay {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: rgba(2,6,23,.55); padding: 24px;
    opacity: 0; transition: opacity .18s;
  }
  .popup-overlay.show { opacity: 1; }
  .popup-card {
    background: var(--surface); border: 1px solid var(--accent);
    border-radius: 16px; padding: 22px 24px; max-width: 340px; width: 100%;
    text-align: center; display: flex; flex-direction: column; gap: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    transform: scale(.85); transition: transform .22s cubic-bezier(.2,1.5,.4,1);
  }
  .popup-overlay.show .popup-card { transform: scale(1); }

  .center { text-align: center; padding: 40px 10px; color: var(--muted); }

  /* single daily event, comfortably wide and centered */
  .bet-slot { margin: 0 auto; }
  .card.bet-here { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .tip-card { background: linear-gradient(180deg, rgba(56,189,248,.08), transparent), var(--surface); }
  .tip-card .tip-text { color: var(--text); font-size: .92rem; line-height: 1.5; }

  /* login: fill exactly one screen, no scroll */
  body.auth-mode main { padding-bottom: 16px; }
  body.auth-mode #view { display: flex; flex-direction: column; }
  .auth-screen {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column; justify-content: flex-start; gap: 8px;
  }
  /* comic strip of every user in the system, top of the login page */
  .faces {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end;
    align-content: flex-start;
    gap: 12px 16px; padding: 26px 8px 4px; min-height: 40px;
    max-height: 48vh; overflow: hidden;
  }
  .face-chip {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    animation: crowd-pop .45s cubic-bezier(.2,1.6,.4,1) both,
               crowd-bob var(--dur, 4s) ease-in-out infinite;
    animation-delay: var(--pop, 0s), var(--delay, 0s);
  }
  .face-chip .face-wrap { position: relative; display: flex; }
  .face-chip .face {
    font-size: var(--size, 1.9rem); line-height: 1;
    transform: rotate(var(--tilt, 0deg));
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.55));
  }
  .face-chip .crown {
    position: absolute; top: -.5em; left: 50%;
    font-size: calc(var(--size, 1.9rem) * .6);
    transform: translateX(-50%) rotate(-14deg);
    pointer-events: none;
  }
  .face-chip .tag {
    font-size: .62rem; font-weight: 700; color: var(--text);
    background: rgba(2,6,23,.82); border: 1px solid var(--line);
    padding: 1px 6px; border-radius: 999px;
    max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .face-chip.leader .face { filter: drop-shadow(0 0 10px rgba(251,191,36,.7)); }
  .face-chip.leader .tag { color: var(--gold); border-color: var(--gold); }
  @keyframes crowd-bob {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-9px) rotate(3deg); }
  }
  @keyframes crowd-pop { from { transform: scale(0) rotate(-40deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .face-chip { animation: crowd-pop .3s both; }
  }

  @media (min-width: 481px) {
    body { align-items: center; padding: 20px 0; background: #020617; }
    #app { border-radius: 22px; overflow: hidden; min-height: min(860px, 94vh); box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  }
</style>
</head>
<body>
<div id="app">
  <header id="hdr" hidden>
    <div>
      <div class="brand">BetOn 🏗️</div>
      <div class="who" id="who"></div>
    </div>
    <button class="btn ghost sm" id="logoutBtn" type="button">↩ התנתקות</button>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs" hidden></nav>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  for (const k of kids.flat()) n.append(k?.nodeType ? k : document.createTextNode(k ?? ''));
  return n;
};
const api = async (path, opts = {}) => {
  const res = await fetch(path, {
    headers: opts.body ? { 'Content-Type': 'application/json' } : {},
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = res.status === 204 ? null : await res.json().catch(() => null);
  if (res.status === 401 && path !== '/api/auth/me') {
    goToLogin(data?.error || 'נדרשת התחברות מחדש');
    throw new Error(data?.error || 'נדרשת התחברות');
  }
  if (!res.ok) throw new Error(data?.error || `שגיאה ${res.status}`);
  return data;
};
let popupT;
function showPopup(msg) {
  if (!msg) return;
  document.querySelector('.popup-overlay')?.remove();
  const overlay = el('div', { className: 'popup-overlay' });
  overlay.onclick = () => overlay.remove();
  overlay.append(el('div', { className: 'popup-card' },
    el('div', { style: 'font-size:2.4rem;line-height:1' }, '🎲'),
    el('div', { style: 'font-size:1.05rem;font-weight:600' }, msg),
    el('div', { className: 'muted', style: 'font-size:.75rem' }, 'הקש לסגירה'),
  ));
  document.body.append(overlay);
  requestAnimationFrame(() => overlay.classList.add('show'));
  clearTimeout(popupT);
  popupT = setTimeout(() => overlay.remove(), 3600);
}

let toastT;
const toast = (msg, isErr = false) => {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toastT);
  toastT = setTimeout(() => (t.className = 'toast'), 2200);
};
const fmt = (n) => (n > 0 ? '+' : '') + (Math.round(n * 100) / 100);
const todayISO = () => new Date().toLocaleDateString('sv-SE'); // YYYY-MM-DD local
const heDate = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('he-IL', { weekday: 'short', day: 'numeric', month: 'numeric' });

const state = { user: null, tab: 'bets', date: todayISO() };

// ---------------- Auth screen ----------------
function renderAuth() {
  document.body.classList.add('auth-mode');
  $('#hdr').hidden = true;
  $('#tabs').hidden = true;
  $('#logoutBtn').hidden = true;
  const view = $('#view');
  view.innerHTML = '';

  const DEFAULT_USER = { username: 'yossi', password: 'beton123' };

  const userI = el('input', { placeholder: 'שם משתמש', autocapitalize: 'off', autocorrect: 'off', value: DEFAULT_USER.username });
  const passI = el('input', { placeholder: 'סיסמה', type: 'password', value: DEFAULT_USER.password });
  const submit = el('button', { className: 'btn primary grow' }, 'כניסה');

  submit.onclick = async () => {
    try {
      state.user = await api('/api/auth/login', {
        method: 'POST',
        body: { username: userI.value.trim(), password: passI.value },
      });
      boot();
    } catch (e) { toast(e.message, true); }
  };
  passI.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit.click(); });

  const faces = el('div', { className: 'faces' });
  renderLoginFaces(faces);

  view.append(el('div', { className: 'auth-screen' },
    faces,
    el('div', {},
      el('h2', { style: 'text-align:center;margin:0 0 10px;font-size:2rem' }, '🏗️ BetOn'),
      el('div', { className: 'card', style: 'margin-bottom:0' },
        el('label', {}, 'שם משתמש'), userI,
        el('label', {}, 'סיסמה'), passI,
        el('div', { className: 'row', style: 'margin-top:14px' }, submit),
      ),
    ),
  ));
}

// ---------------- Tabs / shell ----------------
function renderTabs() {
  const tabs = $('#tabs');
  tabs.hidden = false;
  tabs.innerHTML = '';
  const defs = [
    { id: 'bets', label: 'הימורים', ico: '🎯' },
    { id: 'board', label: 'טבלה', ico: '🏆' },
  ];
  for (const d of defs) {
    tabs.append(el('button', {
      className: state.tab === d.id ? 'active' : '',
      onclick: () => {
        if (!state.user) return renderAuth();
        state.tab = d.id;
        route();
      },
    }, el('span', { className: 'ico' }, d.ico), d.label));
  }
}

function route() {
  renderTabs();
  if (state.tab === 'bets') renderBets();
  else if (state.tab === 'board') renderBoard();
}

// ---------------- comic strip of all users (login page) ----------------
const CROWD_FACES = ['🤪','😜','🤠','🥸','🤓','😎','🙃','🤡','👻','🐸','🦖','👽','🤖','🥳','😹','🐵','🦄','🐙'];
const seeded = (n) => { const x = Math.sin(n) * 43758.5453; return x - Math.floor(x); };

async function renderLoginFaces(container) {
  let users;
  try { users = await api('/api/users'); } catch { return; }
  container.innerHTML = '';

  // size by leaderboard rank (leader biggest + crown), display in random order
  const rankById = new Map(
    [...users].sort((a, b) => b.score - a.score).map((u, i) => [u.id, i])
  );
  const n = users.length;
  const shuffled = users.map((u) => u).sort(() => Math.random() - 0.5);

  shuffled.forEach((u) => {
    const rank = rankById.get(u.id);
    const t = n > 1 ? rank / (n - 1) : 0;           // 0 = leader … 1 = last
    const size = (4.0 - t * 2.0).toFixed(2);        // rem: 4.0 → 2.0
    const isLeader = rank === 0;
    const dur = (3 + seeded(u.id * 5 + 4) * 3).toFixed(2);
    const delay = (seeded(u.id * 11 + 6) * -6).toFixed(2);
    const pop = (Math.random() * 0.6).toFixed(2);
    const tilt = Math.round(seeded(u.id * 13 + 8) * 20 - 10);
    const face = u.icon || CROWD_FACES[Math.floor(seeded(u.id * 17 + 9) * CROWD_FACES.length)];
    const faceWrap = el('div', { className: 'face-wrap' }, el('div', { className: 'face' }, face));
    if (isLeader) faceWrap.prepend(el('span', { className: 'crown' }, '👑'));
    container.append(el('div', {
      className: 'face-chip' + (isLeader ? ' leader' : ''),
      style: `--size:${size}rem;--dur:${dur}s;--delay:${delay}s;--pop:${pop}s;--tilt:${tilt}deg`,
      title: `${u.name} · ${fmt(u.score)} נק'`,
    },
      faceWrap,
      el('div', { className: 'tag' }, u.name),
    ));
  });
}

function dateBar(onChange) {
  const today = todayISO();
  if (state.date > today) state.date = today;
  const isToday = state.date === today;
  const shift = (days) => {
    const d = new Date(state.date + 'T00:00:00');
    d.setDate(d.getDate() + days);
    const next = d.toLocaleDateString('sv-SE');
    if (next > today) return; // no navigating past today
    state.date = next;
    onChange();
  };
  return el('div', { className: 'datebar' },
    el('button', { className: 'btn sm', type: 'button', onclick: () => shift(-1) }, '‹ יום קודם'),
    el('button', {
      className: 'btn sm' + (isToday ? ' primary' : ''), type: 'button',
      disabled: isToday, onclick: () => { state.date = today; onChange(); },
    }, 'ההימור היומי'),
    el('button', { className: 'btn sm', type: 'button', disabled: isToday, onclick: () => shift(1) }, 'היום הבא ›'),
  );
}

// ---------------- Bets screen ----------------
async function renderBets() {
  $('#hdr').hidden = false;
  const view = $('#view');
  view.innerHTML = '';
  view.append(el('h2', {}, 'אירועי היום'), dateBar(renderBets), el('div', { className: 'center' }, 'טוען…'));
  let questions;
  try {
    questions = await api('/api/questions?date=' + state.date);
  } catch (e) { toast(e.message, true); return; }

  const isToday = state.date === todayISO();

  view.innerHTML = '';
  view.append(el('h2', {}, 'אירועים · ' + heDate(state.date)), dateBar(renderBets));
  if (!isToday) {
    view.append(el('div', { className: 'card muted' }, '👁️ צפייה בלבד — ניתן להמר רק על אירועי היום.'));
  }

  if (!questions.length) {
    view.append(el('div', { className: 'center' }, 'אין אירוע ליום הזה 🤷'), tipCard(), crowdStrip());
    return;
  }

  // one event per day: prefer the one holding the bet, else the first
  const betQid = questions[0].my_bet_question_id;
  const q = questions.find((x) => x.id === betQid) || questions[0];

  const showResults = !isToday; // today: show only the chosen bet, never results
  const slot = el('div', { className: 'bet-slot' });
  view.append(slot, tipCard(), crowdStrip());

  const paint = () => {
    slot.innerHTML = '';
    const betHere = q.my_answer_id != null;
    const card = el('div', { className: 'card' + (betHere ? ' bet-here' : '') });
    card.append(el('div', { className: 'row' },
      el('div', { className: 'grow', style: 'font-weight:600' }, q.text),
      el('span', { className: 'pill ' + q.status }, { open: 'פתוח', closed: 'סגור', resolved: 'הוכרע' }[q.status]),
    ));

    const box = el('div', { className: 'answers' });
    for (const a of q.answers) {
      const picked = q.my_answer_id === a.id;
      const isCorrect = showResults && q.status === 'resolved' && q.correct_answer_id === a.id;
      const wrongPick = showResults && q.status === 'resolved' && picked && !isCorrect;
      const btn = el('button', {
        className: 'answer' + (picked ? ' picked' : '') + (isCorrect ? ' correct' : '') + (wrongPick ? ' wrongpick' : ''),
        disabled: q.status !== 'open' || !isToday,
      },
        el('span', {}, a.text + (picked ? '  ✓' : '')),
        el('span', { className: 'val' }, fmt(a.value)),
      );
      if (q.status === 'open' && isToday) {
        btn.onclick = async () => {
          if (picked) return;
          const prev = q.my_answer_id;
          q.my_answer_id = a.id; // optimistic
          paint();
          try {
            const r = await api('/api/bets', { method: 'POST', body: { question_id: q.id, answer_id: a.id } });
            showPopup(r?.message || 'ההימור נשמר ✓');
          } catch (e) {
            q.my_answer_id = prev;
            paint();
            toast(e.message, true);
          }
        };
      }
      box.append(btn);
    }
    card.append(box);

    if (showResults && q.status === 'resolved' && betHere) {
      const hit = q.my_answer_id === q.correct_answer_id;
      const gained = hit ? q.answers.find((a) => a.id === q.correct_answer_id)?.value ?? 0 : 0;
      card.append(el('div', { className: 'muted', style: 'margin-top:8px' },
        hit ? `פגעת! ${fmt(gained)} נקודות` : 'החמצת בשאלה הזו'));
    } else if (betHere) {
      card.append(el('div', { className: 'muted', style: 'margin-top:8px' }, 'ההימור היומי שלך ✓'));
    } else if (!isToday) {
      card.append(el('div', { className: 'muted', style: 'margin-top:8px' }, 'לא הימרת ביום הזה'));
    }
    slot.append(card);
  };

  paint();
}

// daily betting-world tip, random per load, managed in the admin console
function tipCard() {
  const wrap = el('div', { className: 'bet-slot', style: 'margin-top:20px' });
  const card = el('div', { className: 'card tip-card' },
    el('div', { style: 'font-weight:700;margin-bottom:4px' }, '💡 טיפ היום'),
    el('div', { className: 'tip-text muted' }, '…'),
  );
  wrap.append(card);
  api('/api/daily-tip')
    .then((r) => { if (r?.text) card.querySelector('.tip-text').textContent = r.text; else wrap.remove(); })
    .catch(() => wrap.remove());
  return wrap;
}

// the user crowd (same rank-sized icons as the login page)
function crowdStrip() {
  const wrap = el('div', { style: 'margin:16px auto 0' });
  const faces = el('div', { className: 'faces' });
  wrap.append(faces);
  renderLoginFaces(faces);
  return wrap;
}

// ---------------- Leaderboard ----------------
async function renderBoard() {
  $('#hdr').hidden = false;
  const view = $('#view');
  view.innerHTML = '';
  view.append(el('h2', {}, 'טבלת דירוג'), el('div', { className: 'center' }, 'טוען…'));
  let rows;
  try { rows = await api('/api/leaderboard'); }
  catch (e) { toast(e.message, true); return; }

  view.innerHTML = '';
  const wrap = el('div', { className: 'bet-slot' });
  wrap.append(el('h2', {}, 'טבלת דירוג 🏆'));
  const card = el('div', { className: 'card' });
  rows.forEach((r, i) => {
    card.append(el('div', { className: 'lb-row' + (r.id === state.user.id ? ' me' : '') },
      el('div', { className: 'lb-rank' }, String(i + 1)),
      el('div', {},
        el('div', { style: 'font-weight:600' }, r.name),
        el('div', { className: 'muted' }, `${r.hits} פגיעות · ${r.bets_count} הימורים`),
      ),
      el('div', { className: 'lb-score' }, fmt(r.score)),
    ));
  });
  wrap.append(card);
  wrap.append(el('p', { className: 'muted', style: 'text-align:center' }, 'הניקוד = סכום הערכים של התשובות הנכונות שבחרת'));
  view.append(wrap);
}


// ---------------- boot ----------------
function boot() {
  document.body.classList.remove('auth-mode');
  $('#who').textContent = state.user.name + (state.user.is_admin ? ' · מנהל' : '');
  $('#logoutBtn').hidden = false;
  startSessionWatch();
  route();
}
async function logout() {
  await api('/api/auth/logout', { method: 'POST' }).catch(() => {});
  goToLogin();
}
$('#logoutBtn').onclick = logout;

// send an expired / deactivated user back to the login screen
function goToLogin(msg) {
  stopSessionWatch();
  state.user = null;
  renderAuth();
  if (msg) toast(msg, true);
}

// keep verifying the session is still valid: on load, on an interval,
// and whenever the tab regains focus. A null answer means the cookie is
// gone, expired, or the account was deactivated → back to login.
let sessionTimer = null;
async function verifySession() {
  if (!state.user) return;
  let me;
  try { me = await api('/api/auth/me'); }
  catch { return; } // network hiccup — don't log the user out over it
  if (!me || me.id !== state.user.id) {
    goToLogin('החיבור הסתיים. יש להתחבר מחדש.');
  }
}
function startSessionWatch() {
  stopSessionWatch();
  sessionTimer = setInterval(verifySession, 60000);
  document.addEventListener('visibilitychange', onVisible);
}
function stopSessionWatch() {
  clearInterval(sessionTimer);
  sessionTimer = null;
  document.removeEventListener('visibilitychange', onVisible);
}
function onVisible() { if (document.visibilityState === 'visible') verifySession(); }

(async () => {
  try {
    const me = await api('/api/auth/me');
    if (me) { state.user = me; boot(); } else renderAuth();
  } catch { renderAuth(); }
})();
</script>
